name: Keep Render Alive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping panel health
        run: |
          HTTP_STATUS=$(curl -sS --max-time 25 -o /dev/null -w "%{http_code}" \
            "https://vps-hosting-panel.onrender.com/health" || echo "FAIL")
          echo "health=${HTTP_STATUS}"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "alive"
          else
            echo "warning: cold start/retry next tick (${HTTP_STATUS})"
          fi